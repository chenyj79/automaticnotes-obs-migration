# =============================================
# AutomaticNotes - Docker Compose 本地部署
# =============================================
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填入你的 API Key
#   2. 执行: docker compose up -d
#   3. 访问: http://localhost:3000
#
# 服务依赖关系：
#   MySQL → Redis → RocketMQ → 后端 → 前端
# =============================================

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: autonotes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: automatic_notes
      LANG: C.UTF-8
    ports:
      - "3307:3306"   # 宿主端口改 3307，避免与本机 MySQL 的 3306 冲突
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ==================== Redis Stack ====================
  redis:
    image: redis/redis-stack:latest
    container_name: autonotes-redis
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight 管理界面
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==================== RocketMQ NameServer ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: autonotes-namesrv
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -server"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'ss -tlnp | grep 9876 || netstat -tlnp | grep 9876 || echo ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ==================== Whisper ASR Service ====================
  whisper-svc:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    container_name: autonotes-whisper
    ports:
      - "8002:8000"
    environment:
      # 默认 CPU 模式，有 GPU 的话改成 DEVICE=cuda / COMPUTE_TYPE=float16
      DEVICE: cpu
      COMPUTE_TYPE: int8
      # 直接指向本地已下载的模型目录，避免启动时联网下载
      WHISPER_MODEL: /app/models/models/mobiuslabsgmbh--faster-whisper-large-v3-turbo
      BATCH_SIZE: 8
      GPU_DEVICES: "0"
      DOWNLOAD_TIMEOUT: "600"
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./whisper-models:/app/models
      - whisper-funasr-cache:/app/funasr-cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; r=requests.get('http://localhost:8000/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ==================== RocketMQ Broker ====================
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: autonotes-broker
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/rocketmq-5.3.1/conf/broker.conf"]
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -server"
    volumes:
      - ./broker-docker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'ss -tlnp | grep 10911 || netstat -tlnp | grep 10911 || echo ok'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # ==================== 后端 Spring Boot ====================
  backend-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonotes-backend
    # 覆盖 Dockerfile 的 ENTRYPOINT，使用默认 profile（非 prod），通过环境变量注入配置
    entrypoint: ["java", "-jar", "app.jar"]
    ports:
      - "8080:8080"
    environment:
      # 数据库
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/automatic_notes?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # RocketMQ
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876

      # 华为云 OBS（必填）
      HUAWEICLOUD_OBS_ACCESS_KEY_ID: ${HUAWEICLOUD_OBS_ACCESS_KEY_ID}
      HUAWEICLOUD_OBS_ACCESS_KEY_SECRET: ${HUAWEICLOUD_OBS_ACCESS_KEY_SECRET}
      HUAWEICLOUD_OBS_BUCKET_NAME: ${HUAWEICLOUD_OBS_BUCKET_NAME}
      HUAWEICLOUD_OBS_ENDPOINT: ${HUAWEICLOUD_OBS_ENDPOINT:-obs.cn-north-4.myhuaweicloud.com}

      # DashScope 通义千问（必填）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}

      # 阿里云通义听悟 ASR（必填）
      ASR_ALIYUN_ACCESS_KEY_ID: ${ASR_ALIYUN_ACCESS_KEY_ID}
      ASR_ALIYUN_ACCESS_KEY_SECRET: ${ASR_ALIYUN_ACCESS_KEY_SECRET}
      ASR_ALIYUN_APP_KEY: ${ASR_ALIYUN_APP_KEY}

      # 本地 Whisper ASR
      ASR_WHISPER_URL: http://whisper-svc:8000/transcribe
      ASR_WHISPER_RESTORE_PUNC_URL: http://whisper-svc:8000/restore_punc

    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper-svc:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 前端 Nginx ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autonotes-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-svc
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  whisper-models:
  whisper-funasr-cache:
