
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: autonotes
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate           # MySQL 单实例不能滚动更新
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "automatic_notes"
            - name: LANG
              value: C.UTF-8
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
      volumes:
        - name: mysql-data
          hostPath:
            path: /home/autonotes/yaml/mysql-data
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: autonotes
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None            # Headless Service，Pod 直连
