# =============================================
# Frontend - Deployment + Service (NodePort)
# =============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autonotes
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: crpi-dke0j5qt1m8pkeyd.cn-shanghai.personal.cr.aliyuncs.com/autonotes-k8s/automatic-notes-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
# 使用 NodePort 对外暴露，通过 http://<节点IP>:30080 访问
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: autonotes
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
