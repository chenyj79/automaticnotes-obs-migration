# =============================================
# Secret: 存储所有敏感信息
# =============================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: autonotes
type: Opaque
data:
  # MySQL
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_PASSWORD: ""

  # JWT
  JWT_SECRET: ""

  # 华为云 OBS
  HUAWEICLOUD_OBS_ACCESS_KEY_ID: ""
  HUAWEICLOUD_OBS_ACCESS_KEY_SECRET: ""
  HUAWEICLOUD_OBS_BUCKET_NAME: ""
  HUAWEICLOUD_OBS_ENDPOINT: "obs.cn-north-4.myhuaweicloud.com"

  # 阿里云通义听悟 ASR
  ASR_ALIYUN_ACCESS_KEY_ID: ""
  ASR_ALIYUN_ACCESS_KEY_SECRET: ""
  ASR_ALIYUN_APP_KEY: ""

  # DashScope (通义千问)
  DASHSCOPE_API_KEY: ""
