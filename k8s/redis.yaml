# =============================================
# Redis - Deployment + Service
# =============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: autonotes
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: mancanghai0629/redis-stack-server:latest
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: autonotes
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
